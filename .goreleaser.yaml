version: 2
project_name: z9s

builds:
  - main: ./cmd/z9s
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github

# Auto-bump the formula in 00quasr/homebrew-tap on each release.
# Requires a TAP_GITHUB_TOKEN secret on this repo (fine-grained PAT with
# contents:write on homebrew-tap): gh secret set TAP_GITHUB_TOKEN
# Until the secret exists, keep this commented — GoReleaser fails the
# release if the env var is missing.
